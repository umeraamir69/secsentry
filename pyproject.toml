[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "secsentry"
version = "1.4.0"
description = "CLI wrapper for the SecSentry Go secrets scanner"
readme = "packages/pypi/README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "SecSentry" }]
keywords = ["security", "secrets", "git", "scanner"]
dependencies = []

[project.urls]
Homepage = "https://github.com/umeraamir69/secsentry"
Repository = "https://github.com/umeraamir69/secsentry"
Issues = "https://github.com/umeraamir69/secsentry/issues"

[project.scripts]
secsentry = "secsentry.cli:main"

[tool.setuptools.package-dir]
"" = "packages/pypi"

[tool.setuptools.packages.find]
where = ["packages/pypi"]
