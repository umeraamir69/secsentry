# Publishes pip and npm from one tag, so the two registries cannot drift.
#
# PyPI uses Trusted Publishing (OIDC) — configure a *pending* publisher at
# pypi.org/manage/account/publishing pointing at this workflow filename, and no
# token is ever stored.
#
# npm cannot create a package via OIDC (npm/cli#8544). Publish 1.0.0 once by
# hand, attach a Trusted Publisher to the package, then delete NPM_TOKEN and
# every later release runs tokenless.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build && python -m pip install -e ".[dev]"
      - name: Version sync
        run: python scripts/check_version_sync.py
      - name: Tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FILE="$(cat VERSION)"
          [ "$TAG" = "$FILE" ] || { echo "Tag $TAG != VERSION $FILE"; exit 1; }
      - run: python -m pytest tests -q

  pypi:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install -g npm@latest
      - name: Publish
        working-directory: packages/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          else
            # setup-node may leave an empty _authToken line, which makes npm skip
            # the OIDC exchange and fail with ENEEDAUTH. Remove it entirely.
            rm -f ~/.npmrc "$RUNNER_TEMP/.npmrc" || true
          fi
          npm publish --access public
