# Publishes the npm wrapper from a version tag. The engine is the Go binary
# (`go install github.com/umeraamir69/secsentry/cmd/secsentry@latest`).
#
# npm cannot create a package via OIDC (npm/cli#8544). Publish 1.0.0 once by
# hand, attach a Trusted Publisher to the package, then delete NPM_TOKEN and
# every later release runs tokenless.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Version sync
        run: python3 scripts/check_version_sync.py
      - name: Tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FILE="$(cat VERSION)"
          [ "$TAG" = "$FILE" ] || { echo "Tag $TAG != VERSION $FILE"; exit 1; }
      - run: go test ./...
      - run: go build -o secsentry ./cmd/secsentry

  npm:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install -g npm@latest
      - name: Publish
        working-directory: packages/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          else
            rm -f ~/.npmrc "$RUNNER_TEMP/.npmrc" || true
          fi
          npm publish --access public
