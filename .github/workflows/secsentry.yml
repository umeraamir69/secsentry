# Appears on pull requests as a check (same sidebar slot as Vercel).
# See notes/GitHub integration.md
name: SecSentry

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  # Installs the package the same way a user does, so a module that exists on
  # disk but never got committed fails here rather than inside the action.
  tests:
    name: SecSentry / tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Console script is importable
        run: secsentry --version

      - name: Test
        run: python -m pytest -q

  secrets:
    name: SecSentry / secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run SecSentry
        uses: ./
        with:
          history: true
          fail-on: high
          comment: true
