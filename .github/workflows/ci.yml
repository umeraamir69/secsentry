name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[dev]"

      - name: Version sync
        run: python scripts/check_version_sync.py

      - name: Tests
        run: python -m pytest tests -q

      - name: CLI smoke test
        run: |
          secsentry --version
          secsentry scan . --fail-on critical --no-cache

      - name: Build distributions
        run: |
          python -m build
          ls -la dist/

      - name: Reject secrets in the sdist
        run: |
          if tar -tzf dist/*.tar.gz | grep -E '(^|/)\.env$|\.pem$|eval/\.data'; then
            echo "Distribution contains files that must never ship."
            exit 1
          fi
          echo "sdist contents look clean"

  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Pack the wrapper
        working-directory: packages/npm
        run: |
          npm pack --dry-run
          node -e "require('./package.json')"
