name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Version sync
        run: python3 scripts/check_version_sync.py

      - name: Tests
        run: go test ./...

      - name: CLI smoke test
        run: |
          go build -o secsentry ./cmd/secsentry
          ./secsentry --version
          ./secsentry scan . --fail-on critical --no-cache

  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Pack the wrapper
        working-directory: packages/npm
        run: |
          npm pack --dry-run
          node -e "require('./package.json')"
